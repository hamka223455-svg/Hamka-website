<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>LIGHT_LIVE | Ecosystem</title>
    <style>
        :root { --dark: #050505; --neon: #00f2ff; --panel: #1a1a1a; }
        body { background: var(--dark); color: #fff; font-family: sans-serif; margin: 0; }
        .nav { background: #000; padding: 20px; display: flex; justify-content: center; gap: 15px; border-bottom: 2px solid var(--neon); }
        .view { display: none; padding: 20px; } .active { display: block; }
        .card { background: var(--panel); border: 1px solid #333; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 5px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; }
        .btn { padding: 12px; background: var(--neon); color: #000; border: none; cursor: pointer; font-weight: bold; width: 100%; border-radius: 8px; margin-top: 10px; }
        #chat-box { height: 200px; overflow-y: scroll; border: 1px solid #444; padding: 10px; margin-bottom: 10px; background: #000; }
    </style>
</head>
<body>

<nav class="nav">
    <div onclick="show('home')">HOME</div>
    <div onclick="show('games')">SLOT</div>
    <div onclick="show('comm')">KOMUNITAS</div>
    <div onclick="show('support')">BANTUAN</div>
    <div onclick="show('admin')" id="admin-menu" style="display:none;">ADMIN</div>
</nav>

<div id="home" class="view active">
    <div class="card" id="auth">
        <h2>LOGIN / REGISTER</h2>
        <input id="u" placeholder="Username">
        <input id="p" type="password" placeholder="Password">
        <button class="btn" onclick="login()">LOGIN</button>
    </div>
    <div class="card" id="dash" style="display:none;">
        <h2 id="u-name"></h2>
        <p><strong>Pengumuman:</strong> <span id="ann"></span></p>
    </div>
</div>

<div id="games" class="view">
    <div class="card">
        <iframe src="https://hamka223455-svg.github.io/hamka-casino/" style="width:100%; height:70vh; border:none;"></iframe>
    </div>
</div>

<div id="comm" class="view">
    <div class="card">
        <h3>Chat Publik</h3>
        <div id="chat-box"></div>
        <input id="msg" placeholder="Pesan...">
        <button class="btn" onclick="sendChat()">KIRIM</button>
    </div>
</div>

<div id="support" class="view">
    <div class="card">
        <h3>Report & Banding</h3>
        <textarea id="rep" placeholder="Laporan/Banding..."></textarea>
        <button class="btn" onclick="sendReport()">KIRIM</button>
    </div>
</div>

<div id="admin" class="view">
    <div class="card">
        <h2>OWNER PANEL</h2>
        <input id="new-ann" placeholder="Update Pengumuman...">
        <button class="btn" onclick="updateAnn()">UPDATE</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCHNa9G21ktnLNpDovLUWlbu7yFD638G64",
        authDomain: "lightlives.firebaseapp.com",
        databaseURL: "https://lightlives-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "lightlives",
        storageBucket: "lightlives.firebasestorage.app",
        messagingSenderId: "1092994577733",
        appId: "1:1092994577733:web:b9e2edf3e07faacd217a2c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function show(id) { document.querySelectorAll('.view').forEach(v => v.style.display = 'none'); document.getElementById(id).style.display = 'block'; }

    function login() {
        let u = document.getElementById('u').value;
        let p = document.getElementById('p').value;
        if(u === "HAMKA22" && p === "223455") { document.getElementById('admin-menu').style.display = 'block'; }
        localStorage.setItem('user', u);
        document.getElementById('auth').style.display = 'none';
        document.getElementById('dash').style.display = 'block';
        document.getElementById('u-name').innerText = "Halo, " + u;
    }

    function sendChat() {
        db.ref('chat').push({user: localStorage.getItem('user'), text: document.getElementById('msg').value});
    }

    db.ref('chat').on('value', snap => {
        let box = document.getElementById('chat-box'); box.innerHTML = "";
        snap.forEach(c => box.innerHTML += `<p><b>${c.val().user}:</b> ${c.val().text}</p>`);
    });

    db.ref('pengumuman').on('value', snap => document.getElementById('ann').innerText = snap.val());

    function updateAnn() { db.ref('pengumuman').set(document.getElementById('new-ann').value); }
    
    function sendReport() {
        db.ref('reports').push({user: localStorage.getItem('user'), text: document.getElementById('rep').value});
        alert("Laporan terkirim.");
    }
</script>
</body>
</html>
